<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lava Panel - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1f1f 50%, #1a0a0a 100%);
            min-height: 100vh;
            color: #ffffff;
        }

        .navbar {
            background: rgba(42, 26, 26, 0.95);
            border-bottom: 2px solid #ff6b35;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo h1 {
            color: #ff6b35;
            font-size: 1.8rem;
            text-shadow: 0 0 20px rgba(255, 107, 53, 0.5);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #ff9f6b;
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #ff6b35;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(145deg, #2a1a1a 0%, #1f0f0f 100%);
            border: 2px solid #ff6b35;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(255, 107, 53, 0.3);
        }

        .stat-card h3 {
            color: #ff9f6b;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-card .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ff6b35;
        }

        .servers-section {
            background: linear-gradient(145deg, #2a1a1a 0%, #1f0f0f 100%);
            border: 2px solid #ff6b35;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c5a 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
        }

        .server-list {
            display: grid;
            gap: 1rem;
        }

        .server-item {
            background: rgba(45, 31, 31, 0.8);
            border: 2px solid #ff6b35;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .server-info h4 {
            color: #ff6b35;
            margin-bottom: 0.25rem;
        }

        .server-info p {
            color: #ff9f6b;
            font-size: 0.9rem;
        }

        .server-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-running {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
        }

        .status-stopped {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <h1>🔥 Lava Panel</h1>
        </div>
        <ul class="nav-links">
            <li><a href="/">Dashboard</a></li>
            <li><a href="/deploy">Deploy</a></li>
            <li><a href="/servers">Servers</a></li>
            <li><a href="/themes">Themes</a></li>
            <li><a href="#" id="logoutBtn">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Servers</h3>
                <div class="value" id="totalServers">0</div>
            </div>
            <div class="stat-card">
                <h3>Running</h3>
                <div class="value" id="runningServers">0</div>
            </div>
            <div class="stat-card">
                <h3>Coins</h3>
                <div class="value" id="userCoins">0</div>
            </div>
            <div class="stat-card">
                <h3>Active Theme</h3>
                <div class="value" style="font-size: 1.5rem;" id="activeTheme">Lava</div>
            </div>
        </div>

        <div class="servers-section">
            <div class="section-header">
                <h2>Your Servers</h2>
                <button class="btn btn-primary" onclick="window.location.href='/deploy'">+ Deploy Server</button>
            </div>
            <div class="server-list" id="serverList">
                <p style="color: #ff9f6b; text-align: center;">No servers yet. Deploy your first server!</p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('lava_token');
        
        if (!token) {
            window.location.href = '/login.html';
        }

        // WebSocket connection for real-time updates
        let ws = null;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}?token=${token}`;
            
            try {
                ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    console.log('🌋 WebSocket connected');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        handleWebSocketMessage(msg);
                    } catch (e) {
                        console.error('WebSocket message error:', e);
                    }
                };
                
                ws.onclose = () => {
                    console.log('WebSocket disconnected, reconnecting in 5s...');
                    setTimeout(connectWebSocket, 5000);
                };
                
                ws.onerror = (err) => {
                    console.error('WebSocket error:', err);
                };
            } catch (e) {
                console.log('WebSocket not available, using polling mode');
            }
        }

        function handleWebSocketMessage(msg) {
            switch (msg.type) {
                case 'server:status':
                    // Update individual server status badge
                    const badge = document.querySelector(`.server-item [data-server-id="${msg.serverId}"] .status-badge`);
                    if (badge) {
                        badge.textContent = msg.status;
                        badge.className = `status-badge ${msg.status === 'running' ? 'status-running' : 'status-stopped'}`;
                    }
                    // Refresh counts
                    loadStats();
                    break;
                case 'server:deleted':
                    // Remove server card from DOM
                    const serverItem = document.querySelector(`.server-item[data-server-id="${msg.serverId}"]`);
                    if (serverItem) serverItem.remove();
                    loadStats();
                    break;
                case 'server:log':
                    // Could show in a log viewer modal
                    console.log(`[${msg.serverId}]`, msg.line);
                    break;
                case 'stats:update':
                    if (msg.totalServers !== undefined) document.getElementById('totalServers').textContent = msg.totalServers;
                    if (msg.runningServers !== undefined) document.getElementById('runningServers').textContent = msg.runningServers;
                    if (msg.coins !== undefined) document.getElementById('userCoins').textContent = msg.coins;
                    break;
                case 'welcome':
                    console.log('🌋', msg.message);
                    break;
                case 'error':
                    console.error('WebSocket error:', msg.message);
                    break;
            }
        }

        async function loadStats() {
            try {
                const [serversRes, coinsRes] = await Promise.all([
                    fetch('/api/servers', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch('/api/users/coins', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    })
                ]);
                const servers = await serversRes.json();
                const coins = await coinsRes.json();
                document.getElementById('totalServers').textContent = servers.length;
                document.getElementById('runningServers').textContent = servers.filter(s => s.status === 'running').length;
                document.getElementById('userCoins').textContent = coins.coins || 0;
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        }

        async function loadDashboard() {
            try {
                const [serversRes, coinsRes, themeRes] = await Promise.all([
                    fetch('/api/servers', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch('/api/users/coins', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    }),
                    fetch('/api/themes/active')
                ]);

                const servers = await serversRes.json();
                const coins = await coinsRes.json();
                const theme = await themeRes.json();

                document.getElementById('totalServers').textContent = servers.length;
                document.getElementById('runningServers').textContent = servers.filter(s => s.status === 'running').length;
                document.getElementById('userCoins').textContent = coins.coins || 0;
                
                if (theme) {
                    document.getElementById('activeTheme').textContent = theme.name;
                }

                const serverList = document.getElementById('serverList');
                if (servers.length === 0) {
                    serverList.innerHTML = '<p style="color: #ff9f6b; text-align: center;">No servers yet. Deploy your first server!</p>';
                } else {
                    serverList.innerHTML = servers.map(server => `
                        <div class="server-item" data-server-id="${server.id}">
                            <div class="server-info">
                                <h4>${server.name}</h4>
                                <p>${server.type} • Port: ${server.port || 'N/A'}</p>
                            </div>
                            <div class="server-actions">
                                <span class="status-badge ${server.status === 'running' ? 'status-running' : 'status-stopped'}">
                                    ${server.status}
                                </span>
                                ${server.status === 'stopped' 
                                    ? `<button class="btn btn-primary btn-small" onclick="startServer('${server.id}')">Start</button>`
                                    : `<button class="btn btn-primary btn-small" onclick="stopServer('${server.id}')">Stop</button>`
                                }
                                <button class="btn btn-primary btn-small" onclick="deleteServer('${server.id}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        async function startServer(id) {
            const res = await fetch(`/api/servers/${id}/start`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) {
                const err = await res.json();
                alert('Failed to start server: ' + (err.error || 'Unknown error'));
                return;
            }
            loadDashboard();
        }

        async function stopServer(id) {
            const res = await fetch(`/api/servers/${id}/stop`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) {
                const err = await res.json();
                alert('Failed to stop server: ' + (err.error || 'Unknown error'));
                return;
            }
            loadDashboard();
        }

        async function deleteServer(id) {
            if (!confirm('Are you sure you want to delete this server?')) return;
            const res = await fetch(`/api/servers/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) {
                const err = await res.json();
                alert('Failed to delete server: ' + (err.error || 'Unknown error'));
                return;
            }
            loadDashboard();
        }

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('lava_token');
            window.location.href = '/login.html';
        });

        // Initialize
        loadDashboard();
        connectWebSocket();
    </script>
</body>
</html>
